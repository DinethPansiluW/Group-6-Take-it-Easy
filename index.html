<!DOCTYPE html>
<html lang="en">
<head>
  meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Take it Easy | Online Store</title>
  <link rel="stylesheet" href="style.css" />  
</head>
<body>
    <header>
        <title>Home Page</title>
    </header>
    <p>Welcome to the Home Page</p>
        <header class="navbar">
    <div class="container nav-inner">
      <a href="#" class="brand">
        <span class="brand-icon">🛍️</span>
        <div class="brand-text">
          <h1 class="brand-name">Take it Easy</h1>
          <span class="brand-tagline">Smart Shopping & Fast Delivery</span>
        </div>
      </a>

      <div class="search-box">
        <input
          type="search"
          placeholder="Search products, categories..."
          aria-label="Search"
        />
      </div>

      <div class="nav-actions">
        <button type="button" class="btn-outline">Track Order</button>
        <button type="button" class="btn-icon" aria-label="Wishlist">
          ♡ <span>0</span>
        </button>
        <button type="button" class="btn-cart">
          Cart <span class="badge">0</span>
        </button>
      </div>
    </div>
  </header>
</body>
</html>
